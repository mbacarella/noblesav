event: prologue
nodes:
  - id: birth
    scene: longhouse
    characters:
      - id: mother
        sprite: mother
        x: 200
        y: 105
      - id: grandmother
        sprite: grandmother
        x: 300
        y: 100
    text: "You are born in a bark-covered longhouse in the northeast woodlands. It is late autumn. Your mother has been in labor for fourteen hours. There is no midwife trained in medicine — only your grandmother and two older women from the clan, doing what they can."
    next: naming

  - id: naming
    scene: longhouse
    characters:
      - id: mother
        sprite: mother
        x: 200
        y: 105
      - id: grandmother
        sprite: grandmother
        x: 300
        y: 100
    text: "On the fourth day, when it seems you will live, you are given a name. It is not written down — no one here has writing. Your name exists only in the mouths of the people around you. If they all die, your name dies with them."
    random:
      - fork_longhouse
      - fork_aunt

  # === PATH A: The Longhouse ===

  - id: fork_longhouse
    scene: longhouse
    characters:
      - id: mother
        sprite: mother
        x: 220
        y: 105
    text: "Your first winter is brutal. The longhouse is smoky and crowded — twelve families sharing the space. The fire keeps you alive but the smoke burns your lungs. Two infants in the longhouse do not survive to spring. You do, though you will carry the cough for months."
    effects:
      - stat: health
        delta: -10
      - set_flag: longhouse_child
    next: longhouse_spring

  - id: longhouse_spring
    scene: field
    characters:
      - id: mother
        sprite: mother
        x: 250
        y: 102
    text: "Spring comes like a reprieve. The snow melts and the world opens up. Your mother straps you to a cradleboard and carries you to the fields. You spend your first year watching her back as she works — bending, digging, planting. The cradleboard presses your skull flat at the back. It will stay that shape."
    next: longhouse_summer_evening

  - id: longhouse_summer_evening
    mood: beauty
    scene: river
    characters:
      - id: mother
        sprite: mother
        x: 250
        y: 95
    text: "One evening in your second summer, your mother carries you down to the river at dusk. The water is golden. Fireflies rise from the grass in slow drifts. She holds you on her hip and stands in the shallows and the two of you watch the light leave the sky, the stars arriving one at a time like careful visitors. She hums something — not a song you will ever remember, just vibration and warmth. This is the closest thing to safety that exists in your world."
    effects:
      - stat: morale
        delta: 10
    next: longhouse_toddler

  - id: longhouse_toddler
    scene: village
    characters:
      - id: mother
        sprite: mother
        x: 160
        y: 102
        facing: right
    text: "By the time you can walk, you have learned the most important rule of your world: everything is trying to kill you. The river can drown you. The forest can lose you. The plants can poison you. The cold can freeze you. Other tribes can take you. There is no safety net. There is no rescue coming."
    next: longhouse_mother

  - id: longhouse_mother
    scene: field
    characters:
      - id: mother
        sprite: mother
        x: 180
        y: 100
    text: "Your mother carries you on her back while she works the fields. She plants corn, beans, and squash — the Three Sisters. It is backbreaking work done with stone tools. She is twenty-two and looks forty. She has never had a day of rest that she can remember."
    next: chapter_choice

  # === PATH B: The Aunt ===

  - id: fork_aunt
    scene: longhouse
    characters:
      - id: grandmother
        sprite: grandmother
        x: 280
        y: 102
    text: "Your mother does not stop bleeding after the birth. The women pack the wound with moss and hold her legs up. Your grandmother chants. Nothing works. She is dead before you are a day old. You will never know her face. No one here can draw it for you."
    effects:
      - stat: morale
        delta: -15
      - set_flag: motherless
    next: aunt_takes_you

  - id: aunt_takes_you
    scene: longhouse
    characters:
      - id: aunt
        sprite: aunt
        x: 200
        y: 102
      - id: grandmother
        sprite: grandmother
        x: 320
        y: 100
    text: "Your mother's sister takes you. She already has four children and not enough milk for the last one. She is not cruel — she simply has nothing to spare. A woman in the Bear Clan who recently lost an infant nurses you when she can. You are passed between women like a problem no one wants to own."
    effects:
      - stat: standing
        delta: -10
    next: aunt_winter

  - id: aunt_winter
    scene: longhouse
    characters:
      - id: aunt
        sprite: aunt
        x: 180
        y: 102
      - id: child
        sprite: child
        x: 340
        y: 105
    text: "Your first winter, you sleep furthest from the fire. Not by malice — there are simply too many bodies and not enough warmth. You are sick constantly. A rattling cough that never fully clears. Your aunt's oldest son resents the noise you make at night. He is seven. He pinches you when no one is looking."
    effects:
      - stat: health
        delta: -15
      - stat: warmth
        delta: -10
    next: aunt_warmth

  - id: aunt_warmth
    mood: beauty
    scene: longhouse
    characters:
      - id: bear_woman
        sprite: mother
        x: 250
        y: 100
    text: "But there is this: the woman from the Bear Clan who nursed you — she has no obligation to you, no family tie, nothing. Yet sometimes in the evening she finds you and picks you up and holds you against her chest. She lost her own child and something in her body still needs to hold one. You are too young to understand this. You only know that sometimes, for no reason, someone warm is there."
    effects:
      - stat: morale
        delta: 10
    next: aunt_learning

  - id: aunt_learning
    scene: longhouse
    characters:
      - id: aunt
        sprite: aunt
        x: 350
        y: 102
        facing: left
    text: "You learn to walk late. No one has time to help you practice. You learn by pulling yourself up on the longhouse posts and falling until you stop falling. By the time you can run, you have already learned the central fact of your life: no one is coming to help you. Everything you get, you get yourself."
    effects:
      - stat: morale
        delta: -5
      - set_flag: self_reliant
    next: aunt_status

  - id: aunt_status
    scene: village
    characters:
      - id: aunt
        sprite: aunt
        x: 160
        y: 102
      - id: child
        sprite: child
        x: 300
        y: 105
      - id: child2
        sprite: child
        x: 350
        y: 104
    text: "The other children know you are the one whose mother died. In a world without writing, people are their stories, and yours begins with loss. Your aunt does her duty but never calls you her child. You call her 'aunt' and she does not correct you."
    next: chapter_choice

  - id: chapter_choice
    scene: village
    text: "You are five years old. You have survived longer than many. The world stretches out before you — vast, green, and utterly indifferent to whether you live or die. Your childhood begins now."
    effects:
      - stat: morale
        delta: 5
      - set_flag: survived_infancy
    choices:
      - text: "Follow the older children to the river"
        next: river
      - text: "Stay close to your mother in the fields"
        next: fields
      - text: "Wander toward the edge of the forest"
        next: forest

  - id: river
    scene: river
    characters:
      - id: child
        sprite: child
        x: 320
        y: 97
    text: "The older children are catching crayfish in the shallows. A boy named Runs-Fast dares you to cross to the big rock in the middle. The current is stronger than it looks. Last summer, a girl your age was swept away and found downstream two days later. No one speaks her name anymore."
    effects:
      - stat: standing
        delta: 5
    choices:
      - text: "Try to cross to the rock"
        next: river_cross
      - text: "Stay in the shallows"
        next: river_safe

  - id: river_cross
    scene: river
    characters:
      - id: child
        sprite: child
        x: 350
        y: 97
    text: "You wade in. The water reaches your chest and pulls at you. Your feet slip on the mossy stones. For a terrible moment you go under, water filling your nose and mouth. Then your hand finds the rock and you pull yourself up, gasping. The other children cheer. You have proven something, though you are not sure what."
    effects:
      - stat: standing
        delta: 5
      - stat: health
        delta: -5
      - set_flag: brave_child
    choices:
      - text: "Continue playing at the river"
        next: river_afternoon
      - text: "Go back to the village, shaken"
        next: village_return

  - id: river_safe
    scene: river
    characters:
      - id: child
        sprite: child
        x: 280
        y: 102
      - id: child2
        sprite: child
        x: 340
        y: 100
    text: "You stay in the shallows, catching crayfish with the younger children. Runs-Fast calls you a coward. The word stings, but you are alive and dry. In this world, that counts for something."
    effects:
      - stat: morale
        delta: -5
      - set_flag: cautious_child
    next: river_afternoon

  - id: river_afternoon
    scene: river
    characters:
      - id: child
        sprite: child
        x: 300
        y: 100
    text: "The afternoon passes. You eat a crayfish raw because no one brought fire. It tastes like mud and river water. This is your life — small victories measured against constant, ordinary danger."
    next: evening

  - id: fields
    scene: field
    characters:
      - id: mother
        sprite: mother
        x: 200
        y: 100
    text: "Your mother shows you which plants are food and which are not. She points to a cluster of white berries. 'Never eat those. A child in the Wolf Clan ate them two summers ago. He was dead before sundown.' She says it as a fact, not a warning. Death is not dramatic here. It is ordinary."
    effects:
      - stat: morale
        delta: -5
      - set_flag: knows_plants
    next: evening

  - id: forest
    scene: forest
    text: "The forest is enormous and you are very small. You find a clearing where sunlight comes through and sit among the ferns. It is beautiful. It is also where a hunting party from the Flint People killed three of your clan's warriors last autumn. Beauty and violence share the same ground here."
    effects:
      - set_flag: forest_child
    next: evening

  - id: village_return
    scene: village
    characters:
      - id: grandmother
        sprite: grandmother
        x: 300
        y: 100
    text: "You walk back to the village alone, still coughing up river water. Your grandmother sees you and says nothing. She lost four of her own children. She knows the river could have taken you. She is grateful it did not, but she will not say so. Grief and gratitude both live quietly here."
    effects:
      - stat: health
        delta: -5
    next: evening

  - id: evening
    scene: longhouse
    characters:
      - id: elder
        sprite: elder
        x: 250
        y: 100
    text: "That night, the longhouse fills with smoke and voices. An elder tells a story about the world's creation — how the Great Turtle carries the earth on its back. You fall asleep listening. You have no books, no toys, no possessions beyond the clothes on your back. But you are alive. For now, that is enough."
    effects:
      - stat: warmth
        delta: 5
      - stat: morale
        delta: 5
    choices:
      - text: "Continue to Chapter 1"
        next: prologue_end

  - id: prologue_end
    scene: night
    text: "The seasons will turn. You will grow, if you are lucky. Many won't be. This is not a story about heroes or villains. It is a story about what it actually costs to be human when the world offers you nothing but what you can take from it with your hands."
    effects:
      - set_flag: prologue_complete
    next_event: chapter1
