<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Noble Savage</title>

  <!-- Open Graph (Facebook, Discord, etc.) -->
  <meta property="og:title" content="Noble Savage" />
  <meta property="og:description" content="A choose-your-own-adventure about the brutal realities of pre-contact indigenous life. 50% of players don't survive infancy." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://mbacarella.github.io/noblesav/" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Noble Savage" />
  <meta name="twitter:description" content="A choose-your-own-adventure about the brutal realities of pre-contact indigenous life. 50% of players don't survive infancy." />

  <!-- General -->
  <meta name="description" content="A choose-your-own-adventure about the brutal realities of pre-contact indigenous life. Survival is not given." />
  <meta name="theme-color" content="#0a0a0a" />

  <link rel="stylesheet" href="/src/styles/main.css" />
  <link rel="stylesheet" href="/src/styles/screens.css" />
</head>
<body>
  <div id="app">
    <!-- Loading -->
    <div id="screen-loading" class="screen active">
      <div class="loading-bar-container">
        <div class="loading-text">Loading...</div>
        <div class="loading-bar-bg"><div class="loading-bar-fill" id="loading-bar"></div></div>
      </div>
    </div>

    <!-- Title -->
    <div id="screen-title" class="screen">
      <div class="title-content">
        <h1 class="title-heading">NOBLE SAVAGE</h1>
        <p class="title-subtitle">Survival is not given</p>
        <p class="title-prompt pulse">Press any key to begin</p>
      </div>
    </div>

    <!-- Death (infant mortality) -->
    <div id="screen-death" class="screen">
      <div class="death-content">
        <p class="death-text" id="death-text"></p>
        <p class="death-prompt" id="death-prompt">Press any key to try again</p>
      </div>
    </div>

    <!-- Affliction -->
    <div id="screen-affliction" class="screen">
      <div class="affliction-content">
        <p class="affliction-survived" id="affliction-survived">You survived infancy.</p>
        <p class="affliction-name" id="affliction-name"></p>
        <p class="affliction-desc" id="affliction-desc"></p>
        <p class="affliction-modern" id="affliction-modern"></p>
        <p class="affliction-prompt" id="affliction-prompt">Press any key</p>
      </div>
    </div>

    <!-- Dialogue (main game) -->
    <div id="screen-dialogue" class="screen">
      <div class="dialogue-header">
        <span class="dialogue-title" id="dialogue-title">NOBLE SAVAGE</span>
        <span class="dialogue-chapter" id="dialogue-chapter"></span>
      </div>
      <div class="stage-container" id="stage-container">
        <canvas id="stage-canvas"></canvas>
      </div>
      <div class="dialogue-box" id="dialogue-box">
        <div class="dialogue-text" id="dialogue-text"></div>
        <div class="dialogue-choices" id="dialogue-choices"></div>
        <div class="dialogue-continue" id="dialogue-continue">&#9660;</div>
      </div>
      <div class="status-hud" id="status-hud"></div>
    </div>

    <!-- Exile -->
    <div id="screen-exile" class="screen">
      <div class="exile-content">
        <p class="exile-text" id="exile-text"></p>
        <p class="exile-prompt" id="exile-prompt">Press any key to try again</p>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
